<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Liquidity Pools</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self';
                 connect-src 'self' https://api.binance.com;
                 object-src 'none';
                 base-uri 'none'">
  <link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="container">
  <!-- Cabecera -->
  <div class="header">
    <h1>📊 Liquidity Pools</h1>
    <div class="header-actions">
      <button class="btn btn-secondary" id="btnSync" type="button">↻ Sync ETH</button>
      <button class="btn" id="btnNuevaPosicion" type="button">➕ Nueva Posición</button>
    </div>
  </div>

  <!-- Tabs (CSS-only con radio inputs) -->
  <input type="radio" name="tab" id="tabPosiciones" class="tab-radio" checked />
  <input type="radio" name="tab" id="tabEstadisticas" class="tab-radio" />
  <div class="tabs">
    <label class="tab-btn" for="tabPosiciones">📋 Posiciones</label>
    <label class="tab-btn" for="tabEstadisticas">📊 Estadísticas</label>
  </div>

  <p class="sync-status" id="syncStatus">Sincronizá para consultar el precio de ETH en Binance.</p>

  <!-- Vista: Listado -->
  <div id="viewPosiciones" class="tab-view">
    <div id="listadoPosiciones"></div>
  </div>

  <!-- Vista: Estadísticas -->
  <div id="viewEstadisticas" class="tab-view">
    <div id="estadisticasContenido"></div>
  </div>
</div>

<!-- Modal genérico -->
<dialog class="modal" id="modalDialog">
  <div id="modalContenido">
    <!-- El contenido se inyecta dinámicamente -->
  </div>
</dialog>

<script type="module" src="src/main.js"></script>
</body>
</html>
